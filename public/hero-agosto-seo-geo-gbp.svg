<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g1" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </radialGradient>
    <radialGradient id="g2" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#0d2a4a"/>
      <stop offset="100%" stop-color="#0a0f1e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1920" height="600" fill="url(#g1)"/>
  <rect width="1920" height="600" fill="url(#g2)"/>

  <!-- Orange glow — top left -->
  <ellipse cx="280" cy="200" rx="320" ry="200" fill="url(#glow1)"/>
  <!-- Blue glow — right -->
  <ellipse cx="1540" cy="350" rx="420" ry="260" fill="url(#glow2)"/>

  <!-- Network nodes — main cluster left -->
  <g opacity="0.55" filter="url(#blur2)">
    <!-- Lines -->
    <line x1="180" y1="120" x2="390" y2="280" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
    <line x1="390" y1="280" x2="620" y2="190" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
    <line x1="620" y1="190" x2="820" y2="340" stroke="#93c5fd" stroke-width="0.8" opacity="0.35"/>
    <line x1="390" y1="280" x2="290" y2="450" stroke="#60a5fa" stroke-width="0.8" opacity="0.3"/>
    <line x1="820" y1="340" x2="980" y2="210" stroke="#93c5fd" stroke-width="0.8" opacity="0.3"/>
    <line x1="980" y1="210" x2="1150" y2="380" stroke="#60a5fa" stroke-width="0.7" opacity="0.25"/>
    <line x1="180" y1="120" x2="290" y2="450" stroke="#3b82f6" stroke-width="0.6" opacity="0.2"/>
    <line x1="620" y1="190" x2="530" y2="420" stroke="#60a5fa" stroke-width="0.7" opacity="0.25"/>
    <line x1="1150" y1="380" x2="1380" y2="250" stroke="#93c5fd" stroke-width="0.7" opacity="0.2"/>
    <line x1="1380" y1="250" x2="1600" y2="420" stroke="#60a5fa" stroke-width="0.6" opacity="0.18"/>
    <line x1="1600" y1="420" x2="1780" y2="300" stroke="#93c5fd" stroke-width="0.6" opacity="0.18"/>
    <line x1="1150" y1="380" x2="1200" y2="520" stroke="#60a5fa" stroke-width="0.6" opacity="0.2"/>

    <!-- Nodes -->
    <circle cx="180" cy="120" r="5" fill="#f97316" opacity="0.9"/>
    <circle cx="390" cy="280" r="8" fill="#60a5fa" opacity="0.8"/>
    <circle cx="620" cy="190" r="6" fill="#93c5fd" opacity="0.7"/>
    <circle cx="820" cy="340" r="5" fill="#f97316" opacity="0.75"/>
    <circle cx="290" cy="450" r="4" fill="#60a5fa" opacity="0.6"/>
    <circle cx="530" cy="420" r="4" fill="#93c5fd" opacity="0.55"/>
    <circle cx="980" cy="210" r="7" fill="#f97316" opacity="0.8"/>
    <circle cx="1150" cy="380" r="6" fill="#60a5fa" opacity="0.65"/>
    <circle cx="1380" cy="250" r="5" fill="#93c5fd" opacity="0.6"/>
    <circle cx="1600" cy="420" r="4" fill="#60a5fa" opacity="0.5"/>
    <circle cx="1780" cy="300" r="5" fill="#f97316" opacity="0.65"/>
    <circle cx="1200" cy="520" r="3" fill="#93c5fd" opacity="0.45"/>

    <!-- Outer glow on key nodes -->
    <circle cx="390" cy="280" r="16" fill="#60a5fa" opacity="0.12" filter="url(#blur1)"/>
    <circle cx="980" cy="210" r="18" fill="#f97316" opacity="0.18" filter="url(#blur1)"/>
    <circle cx="180" cy="120" r="14" fill="#f97316" opacity="0.2" filter="url(#blur1)"/>
  </g>

  <!-- Fine dot grid — subtle texture -->
  <g opacity="0.08">
    <pattern id="dots" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1" fill="#93c5fd"/>
    </pattern>
    <rect width="1920" height="600" fill="url(#dots)"/>
  </g>

  <!-- Horizontal light bands -->
  <rect x="0" y="0" width="1920" height="1" fill="#60a5fa" opacity="0.12"/>
  <rect x="0" y="599" width="1920" height="1" fill="#60a5fa" opacity="0.08"/>
</svg>
