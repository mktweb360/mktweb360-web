<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2744"/>
      <stop offset="60%" stop-color="#0a1e35"/>
      <stop offset="100%" stop-color="#061220"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="20%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Base gradient -->
  <rect width="1920" height="600" fill="url(#bg)"/>
  <rect width="1920" height="600" fill="url(#glowLeft)"/>
  <rect width="1920" height="600" fill="url(#glowRight)"/>

  <!-- Abstract browser/web frame — top left, large and subtle -->
  <g opacity="0.12" transform="translate(80, 60)">
    <rect width="520" height="340" rx="10" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <!-- Browser bar -->
    <rect width="520" height="36" rx="10" fill="#60a5fa" opacity="0.08"/>
    <circle cx="20" cy="18" r="6" fill="#ef4444" opacity="0.7"/>
    <circle cx="40" cy="18" r="6" fill="#f59e0b" opacity="0.7"/>
    <circle cx="60" cy="18" r="6" fill="#22c55e" opacity="0.7"/>
    <!-- URL bar -->
    <rect x="80" y="10" width="280" height="16" rx="8" fill="#1d4ed8" opacity="0.3"/>
    <!-- Content lines -->
    <rect x="20" y="56" width="200" height="10" rx="3" fill="#93c5fd" opacity="0.35"/>
    <rect x="20" y="76" width="380" height="6" rx="3" fill="#93c5fd" opacity="0.18"/>
    <rect x="20" y="92" width="340" height="6" rx="3" fill="#93c5fd" opacity="0.15"/>
    <rect x="20" y="120" width="480" height="80" rx="8" fill="#1d4ed8" opacity="0.08"/>
    <rect x="20" y="220" width="140" height="6" rx="3" fill="#93c5fd" opacity="0.15"/>
    <rect x="20" y="236" width="320" height="6" rx="3" fill="#93c5fd" opacity="0.12"/>
    <rect x="20" y="252" width="280" height="6" rx="3" fill="#93c5fd" opacity="0.12"/>
  </g>

  <!-- Abstract browser/web frame 2 — right, overlapping -->
  <g opacity="0.08" transform="translate(1260, 120) rotate(-6)">
    <rect width="480" height="310" rx="10" fill="none" stroke="#60a5fa" stroke-width="1.2"/>
    <rect width="480" height="32" rx="10" fill="#60a5fa" opacity="0.06"/>
    <rect x="70" y="8" width="240" height="14" rx="7" fill="#1d4ed8" opacity="0.25"/>
    <rect x="20" y="50" width="160" height="8" rx="3" fill="#93c5fd" opacity="0.3"/>
    <rect x="20" y="68" width="340" height="5" rx="2" fill="#93c5fd" opacity="0.15"/>
    <rect x="20" y="82" width="300" height="5" rx="2" fill="#93c5fd" opacity="0.12"/>
    <rect x="20" y="110" width="440" height="70" rx="6" fill="#1d4ed8" opacity="0.07"/>
  </g>

  <!-- Growth chart lines — center-right area -->
  <g opacity="0.18" transform="translate(900, 80)">
    <polyline points="0,380 120,300 260,320 380,220 500,240 640,140 740,80 860,100 960,40"
              fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="0,380 120,330 260,360 380,280 500,290 640,200 740,150 860,160 960,100"
              fill="none" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <!-- Axis -->
    <line x1="0" y1="400" x2="980" y2="400" stroke="#60a5fa" stroke-width="0.8" opacity="0.4"/>
    <line x1="0" y1="0" x2="0" y2="400" stroke="#60a5fa" stroke-width="0.8" opacity="0.4"/>
    <!-- Data points -->
    <circle cx="640" cy="140" r="5" fill="#60a5fa" opacity="0.8"/>
    <circle cx="960" cy="40" r="6" fill="#f97316" opacity="0.9"/>
  </g>

  <!-- Fine dot texture -->
  <g opacity="0.06">
    <pattern id="dots2" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="1.2" fill="#93c5fd"/>
    </pattern>
    <rect width="1920" height="600" fill="url(#dots2)"/>
  </g>

  <!-- Diagonal subtle lines -->
  <g opacity="0.04" stroke="#60a5fa" stroke-width="1">
    <line x1="600" y1="0" x2="0" y2="600"/>
    <line x1="900" y1="0" x2="300" y2="600"/>
    <line x1="1200" y1="0" x2="600" y2="600"/>
    <line x1="1500" y1="0" x2="900" y2="600"/>
    <line x1="1800" y1="0" x2="1200" y2="600"/>
  </g>
</svg>
