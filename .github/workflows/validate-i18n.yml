name: Validate i18n

on:
  push:
    branches: [main]
    paths:
      - 'lib/i18n/routes.ts'
      - 'app/[lang]/**'
      - 'app/(site)/**'
      - 'scripts/validate-i18n.ts'
  pull_request:
    branches: [main]
    paths:
      - 'lib/i18n/routes.ts'
      - 'app/[lang]/**'
      - 'app/(site)/**'
      - 'scripts/validate-i18n.ts'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 10: pnpm-workspace.yaml usa ajustes de pnpm 10 (allowBuilds); con pnpm 9 el setup fallaba
      # ("packages field missing or empty") y el validador nunca llegaba a ejecutarse.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate i18n coherence
        run: pnpm validate-i18n
